kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gitops
nodes:
  - role: control-plane
    extraPortMappings:
      # webapp (NodePort 30080) -> http://localhost:8081
      - containerPort: 30080
        hostPort: 8081
      # Argo CD UI (NodePort 30443) -> https://localhost:8443
      - containerPort: 30443
        hostPort: 8443
